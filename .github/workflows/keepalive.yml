# Keep-alive: бесплатный проект Supabase засыпает после ~7 дней без запросов.
# Раз в 3 дня дёргаем action=ping (лёгкий запрос к БД) — проект не уснёт.
# Настройка: Settings → Secrets and variables → Actions → Variables →
# New variable: API_URL = https://YOUR_PROJECT_REF.supabase.co/functions/v1/api
name: Keep Supabase awake

on:
  schedule:
    - cron: "0 9 */3 * *" # каждые 3 дня в 09:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Edge Function
        run: |
          curl -sf -X POST "${{ vars.API_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"action":"ping"}'
